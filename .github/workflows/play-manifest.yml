name: play-manifest
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/play-manifest.test.mjs
      - run: node scripts/check-play-remote-updates.mjs
      - run: node --test test/play-remote-updates.test.mjs test/account-delete.test.mjs test/voice-keys.test.mjs
