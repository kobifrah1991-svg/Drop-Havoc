# Full unit suite. Nothing here calls a paid or external service:
# Firebase checks inject a fake certificate fetch, and the room tests
# boot a local server. This file does not depend on any other pull request.
name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
