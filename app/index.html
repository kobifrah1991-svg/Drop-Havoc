<body class="is-gated">
  <script>
  /* Returning players skip the gate. arena.gate is a new key on the existing store prefix; arena.gcred is not renamed. */
  try {
    var gateChoice = localStorage.getItem('arena.gate');
    var gateCred = sessionStorage.getItem('arena.gcred');
    if (gateChoice === '"guest"' || (gateChoice === '"google"' && gateCred)) document.body.classList.remove('is-gated');
  } catch (e) { /* storage blocked: show the gate */ }
  </script>
  <!-- Opening screen (once per launch; public/intro.js fades it out when the game is ready) -->
  <div id="splash" aria-hidden="true">
    <div class="sp-studio"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" class="sp-logo" direction="ltr" role="img" aria-label="Scitedra Games">
  <!-- Scitedra Games studio logo: hexagon badge with a circuit "S" around a play button, after the studio website's mark -->
  <defs>
    <linearGradient id="sgBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fb6ff"/><stop offset=".55" stop-color="#2a7dff"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <linearGradient id="sgFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101a3a"/><stop offset="1" stop-color="#070b1c"/></linearGradient>
    <linearGradient id="sgText" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe2ff"/></linearGradient>
  </defs>
  <g class="sg-badge" transform="translate(10 6)">
    <path class="sg-hex" d="M64 4 L117 34 L117 94 L64 124 L11 94 L11 34 Z" fill="url(#sgFill)" stroke="url(#sgBlue)" stroke-width="7" stroke-linejoin="round"/>
    <!-- circuit S: upper arc from the top-right node, lower arc to the bottom-left node -->
    <path class="sg-s" d="M88 40 Q86 30 64 30 Q40 30 40 48 Q40 62 64 64 Q88 66 88 80 Q88 98 64 98 Q44 98 40 88" fill="none" stroke="url(#sgBlue)" stroke-width="9" stroke-linecap="round"/>
    <circle class="sg-node" cx="88" cy="40" r="6.5" fill="#0b1230" stroke="#5fdcff" stroke-width="3.5"/>
    <circle class="sg-node" cx="40" cy="88" r="6.5" fill="#0b1230" stroke="#5fdcff" stroke-width="3.5"/>
    <path class="sg-play" d="M58 52 L76 64 L58 76 Z" fill="#ffffff"/>
  </g>
  <g class="sg-word">
    <text x="150" y="74" font-family="Rubik, 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="1" fill="url(#sgText)">Scitedra</text>
    <text x="152" y="118" font-family="Rubik, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="12" fill="url(#sgBlue)">GAMES</text>
    <rect x="352" y="104" width="150" height="4" rx="2" fill="#00e5ff" opacity=".85"/>
  </g>
</svg><small data-i18n="intro.presents">presents</small></div>
    <div class="sp-art"></div>
    <div class="sp-title"><h1>DROP<span>HAVOC</span></h1><div class="sp-bar"><i></i></div><p data-i18n="gate.tagline"></p></div>
  </div>
  <script>
  try {
    if (sessionStorage.getItem('arena.splash') === '1' || /[?&]debug/.test(location.search) || matchMedia('(prefers-reduced-motion: reduce)').matches) document.getElementById('splash').remove();
    else { sessionStorage.setItem('arena.splash', '1'); window.__splashT0 = Date.now(); }
  } catch (e) { window.__splashT0 = Date.now(); }
  </script>

  <!-- Team lobby -->
  <div id="lobby" class="hidden">

        <p id="lobby-status"></p>

      <div class="lobby-body">

  <!-- Admin panel (staff only; the server checks every action) -->
  <button id="admin-btn" class="hidden" type="button" data-i18n="admin.panel"></button>
  <div id="admin-panel" class="hidden" role="dialog" aria-modal="true">
    <div class="admin-head"><h2 data-i18n="admin.panel"></h2><button id="admin-close" type="button" aria-label="close">✕</button></div>
    <input id="admin-search" data-i18n-ph="admin.search" autocomplete="off">

    <input data-i18n-ph="admin.reasonPh" maxlength="100" autocomplete="off">

          <path d="M18 36l6 6 6-6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

          <p class="hint" data-i18n="start.friendsHint"></p>
        </div>
        <h3 data-i18n="start.joinTitle"></h3>
        <div class="st-join-box">
          <input class="st-code code-input" maxlength="5" data-i18n-ph="menu.roomCodePh" autocomplete="off">
          <input class="st-pass" maxlength="12" data-i18n-ph="rooms.passPh" autocomplete="off">
          <button type="button" class="st-join st-needs-server" data-i18n="start.joinServer"></button>
          <input class="st-fcode code-input" maxlength="6" data-i18n-ph="start.friendCodePh" autocomplete="off">
          <button type="button" class="secondary st-friends-join" data-i18n="start.friendsJoin"></button>
        </div>
      </section>
    </div>
  </div>
  <div id="menu">
    <div class="menu-shell">
      <header class="topnav">
        <div class="brand"><h1>DROP<span>HAVOC</span></h1><small class="ver">ALPHA 0.16.53</small><a class="sg-brand" href="https://scitedra-games.web.app/" target="_blank" rel="noopener" title="סקיטדרה גיימס · Scitedra Games"><img src="img/scitedra-games-mark-dh.png" alt="Scitedra Games"></a></div>
        <div class="nav-side">
          <div id="profile" class="chip"></div>
          <div id="account" class="chip account-chip"></div>
          <button id="gate-switch" class="chip chip-btn" type="button" data-i18n="gate.switch"></button>
          <button id="shop-btn" class="chip chip-btn" type="button">🛒 <span data-i18n="shop.open"></span></button>
          <label class="chip lang-pick"><span aria-hidden="true">🌐</span> <select class="lang-select" id="lang" data-i18n-aria="menu.language"></select></label>
        </div>
      </header>

      <section class="panel char-panel" data-i18n-aria="menu.charSelect">
        <div class="preview-wrap">
          <canvas id="char-preview" width="480" height="560"></canvas>
          <button id="char-prev" class="arrow" type="button" data-i18n-aria="menu.prevChar">›</button>
          <button id="char-next" class="arrow" type="button" data-i18n-aria="menu.nextChar">‹</button>
          <div class="char-caption">
            <span id="char-kind" class="kind"></span>
            <div id="char-name" class="char-name"></div>
          </div>
          <span class="drag-hint" data-i18n="menu.dragHint"></span>
          <div id="char-loading" class="char-loading hidden" role="status"></div>
        </div>
        <p class="kicker" data-i18n="menu.charKicker"></p>
        <h2 class="sub" data-i18n="menu.charSelect"></h2>
        <div id="char-list" class="char-list" role="radiogroup"></div>
      </section>

      <section class="panel play-panel" data-i18n-aria="menu.gameSettings">
        <div class="callsign">
          <p class="kicker" data-i18n="menu.callsignKicker"></p>
          <label class="name-field"><span data-i18n="menu.playerName"></span> <input id="name" maxlength="16" data-i18n-ph="menu.namePh" autocomplete="nickname"></label>
        </div>
        <p class="hint tabs-lead" data-i18n="menu.tabsLead"></p>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" type="button" data-tab="play" aria-selected="true" data-i18n="menu.tabPlay"></button>
          <button class="tab" role="tab" type="button" data-tab="friends" aria-selected="false" data-i18n="menu.tabFriends"></button>
          <button class="tab" role="tab" type="button" data-tab="servers" aria-selected="false" data-i18n="menu.tabServers"></button>
        </div>

        <div class="tab-page" data-page="play">
          <p class="hint" id="play-hint"></p>
          <label><span data-i18n="menu.map"></span> <select id="map-select"><option value="city" data-i18n="map.city"></option><option value="neon" data-i18n="map.neon"></option><option value="canyon" data-i18n="map.canyon"></option><option value="harbor" data-i18n="map.harbor"></option><option value="jungle" data-i18n="map.jungle"></option><option value="rooftop" data-i18n="map.rooftop"></option><option value="base" data-i18n="map.base"></option><option value="snow" data-i18n="map.snow"></option><option value="factory" data-i18n="map.factory"></option><option value="town" data-i18n="map.town"></option></select></label>
          <label class="practice-only"><span data-i18n="menu.difficulty"></span> <select id="difficulty"><option value="easy" data-i18n="diff.easy"></option><option value="normal" data-i18n="diff.normal"></option><option value="hard" data-i18n="diff.hard"></option><option value="insane" data-i18n="diff.insane"></option></select></label>
          <button id="play" type="button" data-i18n="menu.quickPlay"></button>
        </div>

        <div class="tab-page hidden" data-page="friends">
          <p class="hint" data-i18n="p2p.explain"></p>
          <div class="field-row">
            <select id="p2p-mode" data-i18n-aria="menu.mode">
              <option value="ffa" data-i18n="mode.ffa"></option>
              <option value="duel" data-i18n="mode.duel"></option>
              <option value="team2" data-i18n="mode.team2"></option>
              <option value="roam" data-i18n="mode.roam"></option>
            </select>
            <label><span data-i18n="rooms.capacity"></span> <select id="p2p-capacity"><option value="2">2</option><option value="4">4</option><option value="8">8</option><option value="12">12</option><option value="15" selected>15</option></select></label>
            <button id="p2p-host" class="primary" type="button" data-i18n="p2p.host"></button>
          </div>
          <div class="divider"><span data-i18n="p2p.or"></span></div>
          <div class="field-row">
            <input id="p2p-code" class="code-input" maxlength="5" data-i18n-ph="menu.roomCodePh" autocomplete="off" inputmode="latin">
            <button id="p2p-join" class="secondary" type="button" data-i18n="menu.join"></button>
          </div>
        </div>

        <div class="tab-page hidden" data-page="servers">
          <div class="server-head">
            <h2 class="sub" data-i18n="menu.server"></h2>
            <button id="servers-refresh" class="link" type="button" data-i18n="menu.refresh"></button>
          </div>
          <div id="servers" class="servers" role="radiogroup" data-i18n-aria="menu.serverList"></div>
          <button id="roam-go" class="primary roam-go online-only" type="button"><b data-i18n="roam.go"></b><small data-i18n="roam.goHint"></small></button>
          <p class="hint" data-i18n="gate.serverNote"></p>
          <div class="field-row online-only">
            <select id="mode" data-i18n-aria="menu.mode">
              <option value="ffa" data-i18n="mode.ffa"></option>
              <option value="duel" data-i18n="mode.duel"></option>
              <option value="team2" data-i18n="mode.team2"></option>
              <option value="roam" data-i18n="mode.roam"></option>
            </select>
            <label><span data-i18n="rooms.capacity"></span> <select id="room-capacity"><option value="2">2</option><option value="4">4</option><option value="8">8</option><option value="12">12</option><option value="15" selected>15</option></select></label>
            <button id="create" class="secondary" type="button" data-i18n="menu.createRoom"></button>
          </div>
          <div class="field-row online-only">
            <input id="code" class="code-input" maxlength="5" data-i18n-ph="menu.roomCodePh" autocomplete="off">
            <input id="room-pass" maxlength="12" data-i18n-ph="rooms.passPh" autocomplete="off" style="max-width:9em">
            <button id="join-code" class="secondary" type="button" data-i18n="menu.join"></button>
          </div>
          <label class="check online-only"><input type="checkbox" id="room-public"><span data-i18n="rooms.public"></span></label>
          <div class="online-only"><button id="rooms-refresh" class="secondary" data-i18n="rooms.refresh"></button><div id="room-list" aria-live="polite"></div></div>
          <p id="online-count"></p>
        </div>

        <p id="menu-status" role="status"></p>

        <details class="sheet">
          <summary data-i18n="menu.settings"></summary>
          <label><span data-i18n="menu.sensitivity"></span> <input id="sens" type="range" min="0.3" max="3" step="0.1" value="1"></label>
          <label><span data-i18n="menu.gfx"></span> <select id="gfx"><option value="auto" data-i18n="gfx.auto"></option><option value="low" data-i18n="gfx.low"></option><option value="medium" data-i18n="gfx.medium"></option><option value="high" data-i18n="gfx.high"></option><option value="ultra" data-i18n="gfx.ultra"></option></select></label>
          <label><span data-i18n="menu.timeOfDay"></span> <select id="time"><option value="day" data-i18n="menu.day"></option><option value="night" data-i18n="menu.night"></option></select></label>
          <label class="check"><input id="voice-on" type="checkbox" checked> <span data-i18n="voice.setting"></span></label>
          <label class="check"><input id="voice-open" type="checkbox" checked> <span data-i18n="voice.open"></span></label>
          <label class="check touch-only"><input id="gyro-on" type="checkbox" checked> <span data-i18n="menu.gyro"></span></label>
          <label class="touch-only"><span data-i18n="menu.gyroSens"></span> <input id="gyro-sens" type="range" min="0.3" max="2.5" step="0.1" value="1"></label>
          <label class="check touch-only"><input id="aim-assist" type="checkbox" checked> <span data-i18n="set.aimAssist"></span></label>
          <label class="check touch-only"><input id="auto-fire" type="checkbox"> <span data-i18n="set.autoFire"></span></label>
          <label class="check touch-only"><input id="vibrate-on" type="checkbox" checked> <span data-i18n="set.vibrate"></span></label>
          <label class="check touch-only"><input id="lefty" type="checkbox"> <span data-i18n="set.lefty"></span></label>
          <label><span data-i18n="set.controls"></span> <select id="controls"><option value="auto" data-i18n="set.controlsAuto"></option><option value="touch" data-i18n="set.controlsTouch"></option><option value="mouse" data-i18n="set.controlsMouse"></option></select></label>
          <label><span data-i18n="set.fps"></span> <select id="fps"><option value="60" data-i18n="set.fps60"></option><option value="30" data-i18n="set.fps30"></option></select></label>
        </details>
        <details class="sheet">
          <summary data-i18n="menu.controls"></summary><p data-i18n="menu.newControls"></p>
          <ul>
            <li data-i18n="menu.ctrlMove"></li>
            <li data-i18n="menu.ctrlParkour"></li>
            <li data-i18n="menu.ctrlFire"></li>
            <li data-i18n="menu.ctrlWeapons"></li>
            <li data-i18n="menu.ctrlChat"></li>
            <li data-i18n="voice.ctrl"></li>
            <li data-i18n="menu.ctrlInvite"></li>
            <li data-i18n="menu.ctrlCmds"></li>
          </ul>
        </details>
        <p class="safe" data-i18n="menu.safe"></p>
      </section>
      <a id="credit" class="credit" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>

  <!-- Friend invitation -->
  <div id="invite" class="hidden"><span></span><button class="yes" data-i18n="menu.join"></button><button class="no" data-i18n="hud.notNow"></button></div>

  <!-- End of match -->
  <div id="end" class="hidden">
    <div class="menu-card">
      <h2 id="end-title"></h2>
      <table id="end-board"><thead><tr><th>#</th><th data-i18n="hud.player"></th><th data-i18n="hud.kills"></th><th data-i18n="hud.deaths"></th></tr></thead><tbody></tbody></table>
      <div id="xp-box"><div id="xp-line"></div><div class="xpbar"><div id="xp-fill"></div></div><div id="next-goal"></div></div>
      <p id="end-next"></p>
    </div>
  </div>

  <script>window.ARENA_OFFLINE = true; // static site: practice and friend rooms</script>
  <script src="game.js"></script>

  <!-- In-game update prompt (filled by update-check.js) -->
  <div id="update-banner" class="hidden" role="dialog" aria-live="polite">
    <h3 data-i18n="update.title"></h3>
    <p id="update-notes"></p>
    <div class="ub-ver"><span data-i18n="update.current"></span> <b id="update-current"></b> → <b id="update-latest"></b></div>
    <div class="ub-actions">
      <button type="button" class="primary" id="update-go" data-i18n="update.download"></button>
      <button type="button" id="update-later" data-i18n="update.later"></button>
    </div>
  </div>

</body>
