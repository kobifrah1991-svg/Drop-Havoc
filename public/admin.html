<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ניהול שרת · דרופ האבוק</title>
<meta name="robots" content="noindex">
<style>
:root { --bg:#0e1117; --panel:#171b24; --line:#2a3040; --text:#eef1f7; --muted:#9aa3b8; --accent:#ff8a1f; --red:#e5484d; --green:#3dd68c; --blue:#4c9dff; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Rubik", "Assistant", "Segoe UI", Arial, sans-serif; padding: 16px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
h1 { font-size: 22px; margin: 0 0 4px; } h1 span { color: var(--accent); }
.sub { color: var(--muted); margin: 0 0 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
button { font: inherit; border: 0; border-radius: 10px; padding: 9px 14px; cursor: pointer; color: #fff; background: #2b3242; min-height: 40px; }
button:hover { filter: brightness(1.15); }
button.primary { background: var(--accent); color: #1a1205; font-weight: 700; }
button.red { background: var(--red); } button.blue { background: var(--blue); } button.green { background: #1f7a52; }
input, select, textarea { font: inherit; background: #0f131b; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 40px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs button.on { background: var(--accent); color: #1a1205; font-weight: 700; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { color: var(--muted); font-weight: 600; font-size: 13px; }
td .acts { display: flex; gap: 6px; flex-wrap: wrap; }
td .acts button { padding: 6px 10px; min-height: 34px; font-size: 14px; }
.wrap { overflow-x: auto; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: #2b3242; color: var(--muted); }
.badge.mute { background: #3b2a12; color: #ffb35c; } .badge.staff { background: #12304a; color: #8cc4ff; }
.msg { min-height: 22px; color: var(--muted); }
.msg.err { color: #ff8b8f; } .msg.ok { color: var(--green); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { background: #232a38; padding: 6px 12px; min-height: 34px; } .chips button.on { background: var(--blue); }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 18px; width: min(520px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.6); }
.hidden { display: none !important; }
.muted { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<h1>ניהול שרת · <span>דרופ האבוק</span></h1>
<p class="sub">חסימה, השתקה, הוצאה ואזהרה של שחקנים שמפריעים, מקללים או לא מתנהגים כמו שצריך.</p>

<section class="card" id="login">
  <h2 style="margin-top:0;font-size:18px">כניסה</h2>
  <div class="row"><button class="primary" id="google">כניסה עם Google</button><span class="muted" id="google-note"></span></div>
  <p class="muted" style="margin:14px 0 6px">או עם קוד אדמין של השרת:</p>
  <div class="row"><input id="code" type="password" placeholder="קוד אדמין" autocomplete="off"><button id="code-go">כניסה עם קוד</button></div>
  <p class="msg" id="login-msg"></p>
</section>

<section id="app" class="hidden">
  <div class="card row" style="justify-content:space-between">
    <div><b id="who"></b> <span class="badge staff" id="role"></span></div>
    <div class="muted" id="stats"></div>
  </div>
  <div class="tabs">
    <button data-tab="players" class="on">שחקנים מחוברים</button>
    <button data-tab="bans">חסומים ומושתקים</button>
    <button data-tab="log">יומן פעולות</button>
    <button data-tab="say">הודעה לכולם</button>
  </div>
  <p class="msg" id="msg"></p>
  <div class="card" data-pane="players"><div class="wrap"><table><thead><tr><th>שחקן</th><th>חדר</th><th>הריגות</th><th>פינג</th><th>מצב</th><th>פעולות</th></tr></thead><tbody id="players"></tbody></table></div><p class="muted" id="empty"></p></div>
  <div class="card hidden" data-pane="bans"><div class="wrap"><table><thead><tr><th>סוג</th><th>שחקן</th><th>סיבה</th><th>עד</th><th>על ידי</th><th></th></tr></thead><tbody id="bans"></tbody></table></div></div>
  <div class="card hidden" data-pane="log"><div class="wrap"><table><thead><tr><th>זמן</th><th>מי</th><th>פעולה</th><th>על מי</th><th>פרטים</th><th>תוצאה</th></tr></thead><tbody id="log"></tbody></table></div></div>
  <div class="card hidden" data-pane="say"><div class="row"><input id="say-text" maxlength="200" placeholder="ההודעה תופיע לכל השחקנים בכל החדרים" style="flex:1;min-width:220px"><button class="primary" id="say-go">שליחה</button></div></div>
</section>

<dialog id="act">
  <h3 id="act-title" style="margin-top:0"></h3>
  <p class="muted" style="margin:0 0 6px">סיבה:</p>
  <div class="chips" id="reasons"></div>
  <input id="reason" maxlength="120" placeholder="או כתבו סיבה אחרת" style="width:100%;margin-top:8px">
  <div id="dur-wrap"><p class="muted" style="margin:12px 0 6px">לכמה זמן:</p><div class="chips" id="durs"></div></div>
  <div class="row" style="margin-top:16px;justify-content:flex-start"><button class="red" id="act-go">אישור</button><button id="act-cancel">ביטול</button></div>
</dialog>

<script type="module" src="admin-panel.js"></script>
</body>
</html>
