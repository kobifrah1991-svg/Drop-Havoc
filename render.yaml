# Render Blueprint: one click deploys the game server (https://render.com/deploy?repo=https://github.com/kobifrah1991-svg/Drop-Havoc)
# The free plan sleeps after ~15 minutes without players and wipes its disk on restart, so player saves are kept
# in Firebase Cloud Firestore (FIRESTORE_PROJECT + secret FIRESTORE_PREFIX path); Upstash Redis is an optional extra copy.
services:
  - type: web
    name: drop-havoc
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: BOTS
        value: "4"
      - key: FIRESTORE_PROJECT
        value: scitedra-games
      - key: FIRESTORE_PREFIX
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ADMIN_CODE
        generateValue: true
